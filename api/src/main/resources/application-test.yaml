cors:
  allowed-headers: [ Accept, Content-Type, Authorization ]
  allowed-methods: [ GET, DELETE, POST ]
  allowed-origins: [ http://localhost:3000 ]

info:
  contact:
    name: Burhan Mohammad Sarfraz
    email: burhan.mohammad.sarfraz@outlook.com
  description: A Java RESTful API for an Arduino Thermo Hygrometer IoT device.
  license:
    name: MIT license
    url: https://mit-license.org/
  title: Arduino Thermo Hygrometer API.
  version: 1.0.0-SNAPSHOT

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: when_authorized
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health, info, metrics

rate-limit:
  api-capacity: 10
  api-refill-period: 10m
  authentication-capacity: 5
  authentication-refill-period: 10m
  maximum-buckets: 100
  bucket-expiration: 30m

security:
  jwt-secret-base64: "LbNpq+McWaXkLKdC+wNqfzBNmdU3/qpnDcddcCJI7BoPFiWaWHWMzDhMunKItaeAFSILPLwTd5sCLaZrNfWMbw=="
  jwt-issuer: "arduino-thermo-hygrometer-api-test"
  jwt-audience: "arduino-thermo-hygrometer-api-test"
  access-token-ttl: PT30M
  username: "test-user"
  password-hash: "{bcrypt}$2a$10$nhiie7DaM4/dFUi0ukcweuB.2c1Wkc2dkPKz2tHVA0hwv0AMsIGSy"
  roles: [ ACTUATOR, API_ADMIN ]
  jwt-scheme-name: BearerAuth

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres-local
    password: postgres-local
    url: jdbc:postgresql://localhost:5432/arduinothermohygrometer-local
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    path: /swagger-ui.html
  servers:
    - url: http://{host}:{port}
      description: Test server.
      variables:
        host:
          default: localhost
        port:
          default: 5000
