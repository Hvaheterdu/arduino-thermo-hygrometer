cors:
  allowed-headers: [ Accept, Content-Type, Authorization ]
  allowed-methods: [ GET, DELETE, POST ]
  allowed-origins: [ http://localhost:3000 ]

info:
  contact:
    name: Burhan Mohammad Sarfraz
    email: burhan.mohammad.sarfraz@outlook.com
  description: A Java RESTful API for an Arduino Thermo Hygrometer IoT device.
  license:
    name: MIT license
    url: https://mit-license.org/
  title: Arduino Thermo Hygrometer API.
  version: ${build.version}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: when_authorized
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health, info, metrics

rate-limit:
  api-capacity: 100
  api-refill-period: 10m
  authentication-capacity: 5
  authentication-refill-period: 10m
  maximum-buckets: 100
  bucket-expiration: 30m

security:
  jwt-bearer-format: ${JWT_BEARER_FORMAT}
  jwt-secret-base64: ${JWT_SECRET_BASE64}
  jwt-issuer: ${JWT_ISSUER}
  jwt-audience: ${JWT_AUDIENCE}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
  username: ${JWT_USERNAME}
  password-hash: ${JWT_PASSWORD_HASH}
  roles: [ ACTUATOR, API_ADMIN ]
  jwt-scheme-name: BearerAuth

server:
  port: 5000

spring:
  application:
    group: api
    name: api
  flyway:
    connect-retries: 3
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  mvc:
    problemdetails:
      enabled: true
